# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en-US"
site_theme               : "default" # NEW (theme migration, Sept 2026): available options are "default", "air", "sunrise", "mint", "dirt", "contrast".
                                      # Each theme now auto-adapts to the visitor's light/dark mode preference (with a manual toggle in the masthead).
title                    : "Marianna Zhang"
title_separator          : "-"
name                     : &name "Marianna Zhang"
description              : &description "Postdoctoral Fellow in Developmental Psychology (she/her)"
url                      : https://mariannazhang.github.io # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "mariannazhang/mariannazhang.github.io"
teaser                   :  # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false #change to true to add link to talkmap on talks page
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" # "master", "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" # "iso8601" (default), "timestamp-seconds", "timestamp-milliseconds"
atom_feed:
  hide                   : false # NEW field -- change to true to hide the RSS feed link in the footer
  path                   : # blank (default) uses feed.xml

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :  # Open Graph/Twitter default site image
og_description           :  # NEW field -- Open Graph/Twitter default site image description
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles


# Analytics
# HEADS UP (theme migration, Sept 2026): "google-universal" (Universal Analytics, UA-... IDs) stopped
# processing data in July 2023 -- this tracking ID is very likely dead. The theme now also supports
# "google-analytics-4" for a G-... measurement ID from Google Analytics 4. Left as-is for now; swap the
# provider + tracking_id below once you have a GA4 measurement ID if you want working analytics again.
analytics:
  provider               :  "google-universal" # false (default), "google", "google-universal", "google-analytics-4", "custom"
  google:
    tracking_id          : UA-131282562-1


# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
author:
  # Biographic information
  avatar           : "profile.jpg"
  name             : "Marianna Zhang"
  pronouns         : "she/her"
  bio              : "Postdoctoral Researcher in Developmental Psychology"
  location         : "New York University"
  employer         :
  uri              : # "https://mariannazhang.youcanbook.me"
  email            : "marianna.zhang@nyu.edu"

  # Academic websites
  academia         : # URL -- NEW field
  arxiv            : # URL -- NEW field
  googlescholar    : "https://scholar.google.com/citations?user=U-SQQ48AAAAJ"
  inspire-hep      : # URL -- NEW field
  impactstory      : #"https://profiles.impactstory.org/u/xxxx-xxxx-xxxx-xxxx"
  orcid            : "https://orcid.org/0000-0002-0420-433X"
  semantic         : # URL -- NEW field
  ssrn             : # URL -- NEW field
  pubmed           : # URL -- NEW field
  researchgate     : # "https://www.researchgate.net/profile/Marianna_Zhang"
  scopus           : # URL -- NEW field
  zotero           : # URL -- NEW field

  # Repositories and software development
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "mariannazhang"
  kaggle           : # NEW field
  stackoverflow    : # http://stackoverflow.com/users/123456/username

  # Social media
  artstation       : # NEW field
  bluesky          : "mariannazhang.bsky.social"
  facebook         :
  flickr           :
  foursquare       :
  goodreads        : # NEW field
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         : # "mariannazhang"
  mastodon         : # URL -- NEW field
  medium           : # URL -- NEW field
  pinterest        :
  soundcloud       :
  steam            :
  telegram         : # URL -- NEW field
  tumblr           :
  twitter          : # removed in favor of Bluesky, Sept 2026
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            : # NEW field

# Publication Category -- NEW (theme migration, Sept 2026): only used if your _publications front matter
# sets a matching "category" field; harmless to leave as-is otherwise.
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'


# Reading Files
include:
  - .htaccess
  - advice
  - _posts
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github # NEW (theme migration, Sept 2026)
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/


# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: America/Los_Angeles # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-paginate
#  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
#  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
